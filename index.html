<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --border: #E2DDD6;
  --text: #1A1714;
  --text-muted: #7A746C;
  --accent: #2D6A4F;
  --accent-light: #E8F4EE;
  --accent-mid: #52B788;
  --pill-bg: #EEF7F2;
  --pill-text: #1B5E3B;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Sarabun', 'IBM Plex Sans Thai', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

/* HEADER */
header {
  background: var(--accent);
  padding: 2rem 1.5rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(45,106,79,0.25);
}
.header-inner { max-width: 900px; margin: 0 auto; }
.shop-title { font-size: 22px; font-weight: 600; color: #fff; letter-spacing: 0.01em; }
.shop-sub { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 2px; }
.search-row { display: flex; gap: 8px; margin-top: 1rem; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.5; pointer-events: none; }
#search {
  width: 100%;
  padding: 10px 12px 10px 38px;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 14px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  outline: none;
  transition: background 0.2s;
}
#search::placeholder { color: rgba(255,255,255,0.55); }
#search:focus { background: rgba(255,255,255,0.25); }
select {
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 13px;
  background: rgba(255,255,255,0.15);
  color: #fff;
  outline: none;
  cursor: pointer;
  transition: background 0.2s;
  min-width: 140px;
}
select option { color: var(--text); background: #fff; }
select:focus { background: rgba(255,255,255,0.25); }

/* STATS */
.stats-bar {
  max-width: 900px;
  margin: 1.25rem auto 0;
  padding: 0 1.5rem;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.stat-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 5px 14px;
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: var(--shadow);
}
.stat-chip strong { color: var(--accent); font-weight: 600; }

/* CONTENT */
.content { max-width: 900px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }

/* CATEGORY PILLS */
.cat-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
}
.cat-pill {
  padding: 5px 14px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 500;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.cat-pill:hover { border-color: var(--accent-mid); color: var(--accent); }
.cat-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* COUNT BAR */
.count-info {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 8px;
}
.count-info span { font-weight: 500; color: var(--accent); }

/* TABLE CARD */
.table-card {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow);
}
table { width: 100%; border-collapse: collapse; }
thead th {
  background: #F2EFE9;
  padding: 11px 16px;
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
}
tbody tr { transition: background 0.1s; cursor: default; }
tbody tr:hover { background: #FAFAF8; }
tbody td {
  padding: 11px 16px;
  border-bottom: 1px solid #F0EDE8;
  font-size: 14px;
  color: var(--text);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
.col-name { font-weight: 400; }
.col-cat .badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.col-price { font-weight: 600; color: var(--accent); text-align: right; white-space: nowrap; }
.col-unit { color: var(--text-muted); font-size: 13px; text-align: center; }

/* BADGE COLORS */
.b-diabetes { background: #EBF3FF; color: #1E4D9B; }
.b-pressure { background: #E8F7EF; color: #1A5C3A; }
.b-lipid { background: #FFF5E6; color: #7A4500; }
.b-pain { background: #FFEBE8; color: #7A2510; }
.b-resp { background: #EAF7F1; color: #14593A; }
.b-psych { background: #F0EEFF; color: #3D2A9E; }
.b-vitamin { background: #F0FAF4; color: #1B5E35; }
.b-device { background: #FFF3E0; color: #7A4200; }
.b-other { background: #F2EFE9; color: #5A5248; }

/* EMPTY */
.empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-muted);
}
.empty-state p { font-size: 14px; margin-top: 8px; }

/* FOOTER */
footer {
  text-align: center;
  padding: 1.5rem;
  font-size: 12px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  margin-top: 2rem;
}

/* MOBILE */
@media (max-width: 600px) {
  header { padding: 1.25rem 1rem 1rem; }
  .content { padding: 1rem 1rem 2rem; }
  .stats-bar { padding: 0 1rem; }
  thead th:nth-child(2) { display: none; }
  tbody td:nth-child(2) { display: none; }
  .col-price { text-align: left; }
}
</style>

const data = RAW.map(([name,price,unit]) => ({name,price,unit,category:catOf(name)}));
const prices = data.map(d=>d.price).filter(p=>typeof p==='number');
document.getElementById('totalCount').textContent = data.length;
document.getElementById('minPrice').textContent = Math.min(...prices).toLocaleString();
document.getElementById('maxPrice').textContent = Math.max(...prices).toLocaleString();

let activeCat = "";

const pillsEl = document.getElementById('catPills');
CATS.forEach(c => {
  const el = document.createElement('button');
  el.className = 'cat-pill' + (c==="ทุกหมวด" ? ' active' : '');
  el.textContent = c;
  el.onclick = () => setActiveCat(c === "ทุกหมวด" ? "" : c);
  pillsEl.appendChild(el);
});

function setActiveCat(val) {
  activeCat = val;
  document.getElementById('catFilter').value = val;
  document.querySelectorAll('.cat-pill').forEach(el => {
    const match = val === "" ? el.textContent === "ทุกหมวด" : el.textContent === val;
    el.classList.toggle('active', match);
  });
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = data.filter(d => {
    const mq = !q || d.name.toLowerCase().includes(q);
    const mc = !activeCat || d.category === activeCat;
    return mq && mc;
  });
  const info = document.getElementById('countInfo');
  info.innerHTML = `แสดง <span>${filtered.length.toLocaleString()}</span> รายการ จากทั้งหมด ${data.length.toLocaleString()} รายการ`;
  const tbody = document.getElementById('tbody');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><p>ไม่พบรายการที่ค้นหา</p></td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(d => `
    <tr>
      <td class="col-name">${d.name}</td>
      <td class="col-cat"><span class="badge ${CAT_CLASS[d.category]||'b-other'}">${d.category}</span></td>
      <td class="col-price">${typeof d.price==='number' ? d.price.toLocaleString() + ' ฿' : d.price}</td>
      <td class="col-unit">${d.unit}</td>
    </tr>`).join('');
}
render();
</script>
